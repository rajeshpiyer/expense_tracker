<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions -->
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="backgroundGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D2D2D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A1A;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0.4" />
    </linearGradient>
    
    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    
    <!-- Glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#backgroundGradient)" filter="url(#dropShadow)"/>
  
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#primaryGradient)" stroke-width="4" opacity="0.6"/>
  
  <!-- Main logo elements -->
  <g transform="translate(256, 256)">
    
    <!-- Central finance symbol (stylized F) -->
    <g filter="url(#glow)">
      <!-- Main F shape -->
      <path d="M -60 -80 L -60 80 L -40 80 L -40 10 L 20 10 L 20 -10 L -40 -10 L -40 -40 L 40 -40 L 40 -60 L -60 -60 Z" 
            fill="url(#primaryGradient)" stroke="#FFD700" stroke-width="2"/>
      
      <!-- Flow lines emanating from F -->
      <path d="M 40 -50 Q 80 -50 120 -20 Q 140 -10 160 10" 
            fill="none" stroke="url(#flowGradient)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
      
      <path d="M 40 -20 Q 90 -20 140 0 Q 160 10 180 30" 
            fill="none" stroke="url(#flowGradient)" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
      
      <path d="M 40 10 Q 80 10 120 40 Q 140 50 160 70" 
            fill="none" stroke="url(#flowGradient)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    </g>
    
    <!-- Flow particles/dots -->
    <g opacity="0.7">
      <circle cx="100" cy="-35" r="3" fill="#FFD700">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="130" cy="-15" r="2" fill="#FFA500">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite" begin="0.3s"/>
      </circle>
      <circle cx="150" cy="5" r="4" fill="#FFD700">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite" begin="0.6s"/>
      </circle>
      <circle cx="120" cy="25" r="2" fill="#FFA500">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" begin="0.9s"/>
      </circle>
      <circle cx="140" cy="45" r="3" fill="#FFD700">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite" begin="1.2s"/>
      </circle>
    </g>
    
    <!-- Secondary flow elements (left side) -->
    <g opacity="0.4">
      <path d="M -80 -30 Q -120 -30 -160 -10 Q -180 0 -200 20" 
            fill="none" stroke="url(#flowGradient)" stroke-width="3" stroke-linecap="round"/>
      <path d="M -80 20 Q -110 20 -140 40 Q -160 50 -180 70" 
            fill="none" stroke="url(#flowGradient)" stroke-width="3" stroke-linecap="round"/>
    </g>
    
    <!-- Bottom accent line -->
    <path d="M -80 90 L 80 90" stroke="url(#primaryGradient)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    
  </g>
  
  <!-- Corner accent elements -->
  <g opacity="0.3">
    <circle cx="80" cy="80" r="2" fill="#FFD700"/>
    <circle cx="432" cy="80" r="2" fill="#FFA500"/>
    <circle cx="80" cy="432" r="2" fill="#FFA500"/>
    <circle cx="432" cy="432" r="2" fill="#FFD700"/>
  </g>
  
</svg>
